name: ci

on:
    push:
        branches: [ main ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: validate the manifest
                run: composer validate --strict
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-8.2-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-8.2-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   name: cs check
                run: composer cs-check

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4' ]
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ matrix.php }}-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   uses: actions/cache@v4
                with:
                    path: vendor/bin/.phpunit
                    key: phpunit-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
            -   name: phpstan
                run: composer phpstan
            -   name: test
                run: composer test
            -   name: integration suite
                run: composer test-integration -- --fail-on-skipped

    audit:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: audit the locked dependencies
                run: composer deps-audit
